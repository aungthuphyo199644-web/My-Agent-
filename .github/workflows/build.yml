# ===== part3.sh အဆုံး =====
name: Build AI Agent APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write app source
        run: |
          bash part1.sh
          bash part2.sh
          bash part3.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk ai-agent.apk
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest ai-agent.apk --repo "$GITHUB_REPOSITORY" --title "AI Agent" --notes "ai-agent.apk ကို download ပြီး install လုပ်ပါ"

      - uses: actions/upload-artifact@v4
        with:
          name: ai-agent-apk
          path: ai-agent.apk
