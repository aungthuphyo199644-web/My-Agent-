package com.royal.aiagent;

import android.app.Activity;
import android.content.Intent;
import android.content.SharedPreferences;
import android.graphics.Color;
import android.graphics.Typeface;
import android.os.Bundle;
import android.provider.Settings;
import android.text.InputType;
import android.view.Gravity;
import android.view.View;
import android.widget.Button;
import android.widget.CheckBox;
import android.widget.EditText;
import android.widget.LinearLayout;
import android.widget.ScrollView;
import android.widget.Switch;
import android.widget.TextView;
import android.widget.Toast;

import java.util.ArrayList;
import java.util.List;

/** Settings screen: turn the agent on/off, set the AI key, prompt and filters, view the reply log. */
public class MainActivity extends Activity {

    private Store store;
    private LinearLayout root;

    private TextView status;
    private Switch enabled;
    private EditText apiKey, model, delay, keywords, skipNames, prompt, testMsg;
    private CheckBox viber, messenger, messengerLite, ignoreGroups;
    private TextView testResult, log;

    @Override
    protected void onCreate(Bundle b) {
        super.onCreate(b);
        store = new Store(this);

        ScrollView scroll = new ScrollView(this);
        root = new LinearLayout(this);
        root.setOrientation(LinearLayout.VERTICAL);
        int pad = dp(16);
        root.setPadding(pad, pad, pad, dp(48));
        scroll.addView(root);
        setContentView(scroll);

        TextView title = text("🤖 AI Agent", 24);
        title.setTypeface(Typeface.DEFAULT_BOLD);
        root.addView(title);
        root.addView(text("Viber / Messenger စာဝင်တာကို AI နဲ့ အော်တို ပြန်ဖြေပေးပါတယ်", 14));

        status = text("", 15);
        status.setPadding(0, dp(12), 0, dp(4));
        root.addView(status);

        button("① Notification ဖတ်ခွင့် ပေးရန်", v ->
                startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS")));
        button("② Battery မပိတ်အောင် လုပ်ရန်", v -> {
            try {
                startActivity(new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS));
            } catch (Exception e) {
                startActivity(new Intent(Settings.ACTION_SETTINGS));
            }
        });

        header("ဖွင့်/ပိတ်");
        enabled = new Switch(this);
        enabled.setText("Agent ဖွင့်မယ်");
        enabled.setTextSize(17);
        enabled.setPadding(0, dp(8), 0, dp(8));
        root.addView(enabled);

        header("AI");
        apiKey = field("OpenRouter API key (sk-or-...)", false);
        apiKey.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_PASSWORD);
        model = field("Model (ဥပမာ google/gemini-2.5-flash)", false);

        header("ဘယ် app တွေ ဖြေမလဲ");
        viber = check("Viber");
        messenger = check("Messenger");
        messengerLite = check("Messenger Lite");
        ignoreGroups = check("Group chat တွေ မဖြေနဲ့");

        header("စည်းကမ်း");
        delay = field("စောင့်ချိန် (စက္ကန့်) — ဥပမာ 10", false);
        delay.setInputType(InputType.TYPE_CLASS_NUMBER);
        keywords = field("Keyword ပါမှ ဖြေ (ကော်မာခြား၊ အလွတ်ထားရင် အကုန်ဖြေ) — ဥပမာ ဈေး,diamond,uc", false);
        skipNames = field("ဒီနာမည်တွေ ဘယ်တော့မှ မဖြေနဲ့ (ကော်မာခြား) — ဥပမာ အမေ,မိန်းမ", false);

        header("ဆိုင်အချက်အလက် / Prompt");
        prompt = field("AI ကို ဘယ်လိုပြောရမလဲ", true);

        Button save = button("💾 သိမ်းမယ်", v -> save());
        save.setBackgroundColor(Color.parseColor("#2E7D32"));
        save.setTextColor(Color.WHITE);

        header("AI စမ်းမေးကြည့်ရန်");
        testMsg = field("Customer လို စာရိုက်ကြည့်ပါ — ဥပမာ ML 86 ဘယ်လောက်လဲ", false);
        button("▶ စမ်းမယ်", v -> test());
        testResult = text("", 15);
        testResult.setTextIsSelectable(true);
        root.addView(testResult);

        header("ဖြေခဲ့တဲ့ စာရင်း (Log)");
        LinearLayout row = new LinearLayout(this);
        row.setOrientation(LinearLayout.HORIZONTAL);
        Button refresh = new Button(this);
        refresh.setText("🔄 ပြန်ကြည့်");
        refresh.setOnClickListener(v -> refreshLog());
        Button clear = new Button(this);
        clear.setText("🗑 ဖျက်");
        clear.setOnClickListener(v -> {
            Store.clearLog(this);
            refreshLog();
        });
        row.addView(refresh);
        row.addView(clear);
        root.addView(row);
        log = text("", 13);
        log.setTextIsSelectable(true);
        root.addView(log);

        load();
    }

    @Override
    protected void onResume() {
        super.onResume();
        refreshStatus();
        refreshLog();
    }

    private void load() {
        SharedPreferences p = store.prefs();
        enabled.setChecked(store.enabled());
        apiKey.setText(store.apiKey());
        model.setText(store.model());
        viber.setChecked(p.getBoolean("app_viber", true));
        messenger.setChecked(p.getBoolean("app_messenger", true));
        messengerLite.setChecked(p.getBoolean("app_messenger_lite", true));
        ignoreGroups.setChecked(store.ignoreGroups());
        delay.setText(String.valueOf(store.delaySec()));
        keywords.setText(store.keywords());
        skipNames.setText(store.skipNames());
        prompt.setText(store.prompt());
    }

    private void save() {
        int d;
        try {
            d = Integer.parseInt(delay.getText().toString().trim());
        } catch (NumberFormatException e) {
            d = 10;
        }
        store.prefs().edit()
                .putBoolean("enabled", enabled.isChecked())
                .putString("api_key", apiKey.getText().toString().trim())
                .putString("model", model.getText().toString().trim())
                .putBoolean("app_viber", viber.isChecked())
                .putBoolean("app_messenger", messenger.isChecked())
                .putBoolean("app_messenger_lite", messengerLite.isChecked())
                .putBoolean("ignore_groups", ignoreGroups.isChecked())
                .putInt("delay", Math.max(3, d))
                .putString("keywords", keywords.getText().toString())
                .putString("skip_names", skipNames.getText().toString())
                .putString("prompt", prompt.getText().toString())
                .apply();
        refreshStatus();
        Toast.makeText(this, "သိမ်းပြီးပါပြီ ✅", Toast.LENGTH_SHORT).show();
    }

    private void test() {
        save();
        final String msg = testMsg.getText().toString().trim();
        if (msg.isEmpty()) {
            testResult.setText("စာတစ်ခုခု ရိုက်ပါ");
            return;
        }
        testResult.setText("⏳ AI စဉ်းစားနေတယ်...");
        final String key = store.apiKey(), m = store.model(), pr = store.prompt();
        new Thread(() -> {
            String r;
            try {
                List<String[]> h = new ArrayList<>();
                h.add(new String[]{"user", msg});
                r = "🤖 " + AiClient.ask(key, m, pr, h);
            } catch (Exception e) {
                r = "❌ " + e.getMessage();
            }
            final String result = r;
            runOnUiThread(() -> testResult.setText(result));
        }).start();
    }

    private void refreshStatus() {
        String listeners = Settings.Secure.getString(getContentResolver(), "enabled_notification_listeners");
        boolean access = listeners != null && listeners.contains(getPackageName());
        StringBuilder b = new StringBuilder();
        b.append(access ? "✅ Notification ဖတ်ခွင့် ရပြီ" : "⚠️ Notification ဖတ်ခွင့် မပေးရသေး (① ကိုနှိပ်ပါ)");
        b.append('\n');
        b.append(store.apiKey().isEmpty() ? "⚠️ API key မထည့်ရသေး" : "✅ API key ထည့်ပြီး");
        b.append('\n');
        b.append(store.enabled() ? "🟢 Agent ဖွင့်ထားတယ်" : "⚪ Agent ပိတ်ထားတယ်");
        status.setText(b.toString());
    }

    private void refreshLog() {
        String l = Store.readLog(this);
        log.setText(l.isEmpty() ? "(မရှိသေးပါ)" : l);
    }

    // ---------- small UI helpers ----------

    private int dp(int v) {
        return Math.round(v * getResources().getDisplayMetrics().density);
    }

    private TextView text(String s, int sp) {
        TextView t = new TextView(this);
        t.setText(s);
        t.setTextSize(sp);
        return t;
    }

    private void header(String s) {
        TextView t = text(s, 16);
        t.setTypeface(Typeface.DEFAULT_BOLD);
        t.setPadding(0, dp(20), 0, dp(4));
        root.addView(t);
    }

    private EditText field(String hint, boolean multiline) {
        EditText e = new EditText(this);
        e.setHint(hint);
        e.setTextSize(15);
        if (multiline) {
            e.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_FLAG_MULTI_LINE);
            e.setMinLines(8);
            e.setGravity(Gravity.TOP | Gravity.START);
        } else {
            e.setInputType(InputType.TYPE_CLASS_TEXT);
        }
        root.addView(e);
        return e;
    }

    private CheckBox check(String label) {
        CheckBox c = new CheckBox(this);
        c.setText(label);
        c.setTextSize(15);
        root.addView(c);
        return c;
    }

    private Button button(String label, View.OnClickListener l) {
        Button btn = new Button(this);
        btn.setText(label);
        btn.setAllCaps(false);
        btn.setOnClickListener(l);
        root.addView(btn);
        return btn;
    }
}
