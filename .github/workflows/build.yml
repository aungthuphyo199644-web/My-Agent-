package com.royal.aiagent;

import org.json.JSONArray;
import org.json.JSONObject;

import java.io.ByteArrayOutputStream;
import java.io.InputStream;
import java.io.OutputStream;
import java.net.HttpURLConnection;
import java.net.URL;
import java.nio.charset.StandardCharsets;
import java.util.List;

/** Sends a chat to OpenRouter and returns the AI's reply text. */
public class AiClient {

    private static final String URL_CHAT = "https://openrouter.ai/api/v1/chat/completions";

    /**
     * @param history list of {role, content} pairs, role is "user" or "assistant"
     */
    public static String ask(String apiKey, String model, String system, List<String[]> history)
            throws Exception {
        if (apiKey == null || apiKey.isEmpty()) {
            throw new Exception("OpenRouter API key မထည့်ရသေးပါ");
        }

        JSONArray msgs = new JSONArray();
        msgs.put(new JSONObject().put("role", "system").put("content", system));
        for (String[] h : history) {
            msgs.put(new JSONObject().put("role", h[0]).put("content", h[1]));
        }
        JSONObject body = new JSONObject();
        body.put("model", model);
        body.put("messages", msgs);
        body.put("max_tokens", 500);
        byte[] out = body.toString().getBytes(StandardCharsets.UTF_8);

        HttpURLConnection c = (HttpURLConnection) new URL(URL_CHAT).openConnection();
        try {
            c.setRequestMethod("POST");
            c.setConnectTimeout(20000);
            c.setReadTimeout(60000);
            c.setDoOutput(true);
            c.setRequestProperty("Authorization", "Bearer " + apiKey);
            c.setRequestProperty("Content-Type", "application/json; charset=utf-8");
            c.setRequestProperty("X-Title", "AI Agent");
            OutputStream os = c.getOutputStream();
            os.write(out);
            os.close();

            int code = c.getResponseCode();
            InputStream is = code < 400 ? c.getInputStream() : c.getErrorStream();
            String resp = readAll(is);
            if (code >= 400) {
                throw new Exception("HTTP " + code + ": " + cut(resp, 200));
            }
            JSONObject json = new JSONObject(resp);
            return json.getJSONArray("choices")
                    .getJSONObject(0)
                    .getJSONObject("message")
                    .getString("content")
                    .trim();
        } finally {
            c.disconnect();
        }
    }

    private static String readAll(InputStream is) throws Exception {
        if (is == null) return "";
        ByteArrayOutputStream bos = new ByteArrayOutputStream();
        byte[] buf = new byte[4096];
        int n;
        while ((n = is.read(buf)) > 0) bos.write(buf, 0, n);
        is.close();
        return new String(bos.toByteArray(), StandardCharsets.UTF_8);
    }

    static String cut(String s, int max) {
        return s.length() <= max ? s : s.substring(0, max) + "…";
    }
}
