package com.royal.aiagent;

import android.app.Notification;
import android.app.PendingIntent;
import android.app.RemoteInput;
import android.content.Intent;
import android.os.Build;
import android.os.Bundle;
import android.os.Handler;
import android.os.Looper;
import android.os.Parcelable;
import android.service.notification.NotificationListenerService;
import android.service.notification.StatusBarNotification;

import java.util.ArrayList;
import java.util.HashMap;
import java.util.LinkedList;
import java.util.List;
import java.util.Map;
import java.util.concurrent.ExecutorService;
import java.util.concurrent.Executors;

/**
 * Reads incoming Viber / Messenger notifications, asks the AI for an answer,
 * and sends it back through the notification's own "Reply" action.
 */
public class ReplyService extends NotificationListenerService {

    private static final long ACTIVE_WINDOW_MS = 30L * 60 * 1000; // keywords not needed for 30 min after a reply
    private static final int MAX_HISTORY = 20;                    // messages remembered per customer

    private final Handler main = new Handler(Looper.getMainLooper());
    private final ExecutorService worker = Executors.newSingleThreadExecutor();

    private final Map<String, Pending> pending = new HashMap<>();
    private final Map<String, LinkedList<String[]>> history = new HashMap<>();
    private final Map<String, Long> lastActive = new HashMap<>();
    private final Map<String, String> lastSeen = new HashMap<>();
    private final Map<String, String> lastReply = new HashMap<>();

    /** Messages from one sender collected during the delay, answered together. */
    private static class Pending {
        final StringBuilder text = new StringBuilder();
        Notification.Action action;
        String sender;
    }

    @Override
    public void onNotificationPosted(StatusBarNotification sbn) {
        try {
            handle(sbn);
        } catch (Throwable t) {
            Store.log(this, "Error: " + t);
        }
    }

    private void handle(StatusBarNotification sbn) {
        Store s = new Store(this);
        if (!s.enabled()) return;

        String pkg = sbn.getPackageName();
        if (!s.appEnabled(pkg)) return;

        Notification n = sbn.getNotification();
        if (n == null || (n.flags & Notification.FLAG_GROUP_SUMMARY) != 0 || sbn.isOngoing()) return;

        Notification.Action action = findReplyAction(n);
        if (action == null) return;

        Bundle ex = n.extras;
        String sender = str(ex.getCharSequence(Notification.EXTRA_TITLE));
        String text = str(ex.getCharSequence(Notification.EXTRA_TEXT));

        boolean group = ex.getCharSequence(Notification.EXTRA_CONVERSATION_TITLE) != null;
        if (Build.VERSION.SDK_INT >= 28
                && ex.getBoolean(Notification.EXTRA_IS_GROUP_CONVERSATION, false)) {
            group = true;
        }

        // Chat-style notifications: use the newest message, and ignore it if we sent it.
        Parcelable[] msgs = ex.getParcelableArray(Notification.EXTRA_MESSAGES);
        if (msgs != null && msgs.length > 0 && msgs[msgs.length - 1] instanceof Bundle) {
            Bundle last = (Bundle) msgs[msgs.length - 1];
            CharSequence t = last.getCharSequence("text");
            if (t != null) text = t.toString();
            boolean hasSender = last.getCharSequence("sender") != null || last.containsKey("sender_person");
            if (!hasSender) return; // our own message
        }

        sender = sender.trim();
        text = text.trim();
        if (sender.isEmpty() || text.isEmpty()) return;
        if (group && s.ignoreGroups()) return;
        if (s.isSkipped(sender)) return;

        String key = pkg + "|" + sender;
        if (text.equals(lastReply.get(key))) return; // our reply echoed back
        if (text.equals(lastSeen.get(key))) return;  // same notification updated again
        lastSeen.put(key, text);

        long now = System.currentTimeMillis();
        Long la = lastActive.get(key);
        boolean active = la != null && now - la < ACTIVE_WINDOW_MS;
        if (!active && !s.matchesKeyword(text)) return;

        Pending p = pending.get(key);
        boolean schedule = false;
        if (p == null) {
            p = new Pending();
            p.sender = sender;
            pending.put(key, p);
            schedule = true;
        }
        if (p.text.length() > 0) p.text.append('\n');
        p.text.append(text);
        p.action = action;

        if (schedule) {
            main.postDelayed(() -> fire(key), s.delaySec() * 1000L);
        }
    }

    private void fire(String key) {
        Pending p = pending.remove(key);
        if (p == null) return;
        Store s = new Store(this);
        if (!s.enabled()) return;

        LinkedList<String[]> h = history.get(key);
        if (h == null) {
            h = new LinkedList<>();
            history.put(key, h);
        }
        final LinkedList<String[]> hist = h;
        final String userText = p.text.toString();
        final String apiKey = s.apiKey();
        final String model = s.model();
        final String prompt = s.prompt();

        worker.submit(() -> {
            List<String[]> copy;
            synchronized (hist) {
                hist.add(new String[]{"user", userText});
                while (hist.size() > MAX_HISTORY) hist.removeFirst();
                copy = new ArrayList<>(hist);
            }
            String answer;
            try {
                answer = AiClient.ask(apiKey, model, prompt, copy);
            } catch (Exception e) {
                Store.log(this, "❌ " + p.sender + ": " + e.getMessage());
                return;
            }
            if (answer.isEmpty() || answer.replaceAll("[^A-Za-z]", "").equalsIgnoreCase("SKIP")) {
                Store.log(this, "⏭ " + p.sender + ": (မဖြေ) " + AiClient.cut(userText, 60));
                return;
            }
            synchronized (hist) {
                hist.add(new String[]{"assistant", answer});
            }
            final String reply = answer;
            main.post(() -> send(key, p, reply));
        });
    }

    private void send(String key, Pending p, String reply) {
        try {
            RemoteInput[] inputs = p.action.getRemoteInputs();
            Intent intent = new Intent();
            Bundle results = new Bundle();
            for (RemoteInput ri : inputs) {
                results.putCharSequence(ri.getResultKey(), reply);
            }
            RemoteInput.addResultsToIntent(inputs, intent, results);
            p.action.actionIntent.send(this, 0, intent);

            lastReply.put(key, reply);
            lastActive.put(key, System.currentTimeMillis());
            Store.log(this, "✅ " + p.sender + ": " + AiClient.cut(p.text.toString(), 40)
                    + "  →  " + AiClient.cut(reply, 80));
        } catch (PendingIntent.CanceledException e) {
            Store.log(this, "❌ " + p.sender + ": Reply ပို့မရ (notification ပိတ်သွားပြီ)");
        }
    }

    /** Finds the notification action that accepts typed text (the "Reply" button). */
    private static Notification.Action findReplyAction(Notification n) {
        if (n.actions != null) {
            for (Notification.Action a : n.actions) {
                if (isReply(a)) return a;
            }
        }
        for (Notification.Action a : new Notification.WearableExtender(n).getActions()) {
            if (isReply(a)) return a;
        }
        return null;
    }

    private static boolean isReply(Notification.Action a) {
        if (a == null || a.actionIntent == null) return false;
        RemoteInput[] r = a.getRemoteInputs();
        if (r == null) return false;
        for (RemoteInput ri : r) {
            if (ri.getAllowFreeFormInput()) return true;
        }
        return false;
    }

    private static String str(CharSequence cs) {
        return cs == null ? "" : cs.toString();
    }
}
