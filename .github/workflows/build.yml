package com.royal.aiagent;

import android.content.Context;
import android.content.SharedPreferences;

import java.text.SimpleDateFormat;
import java.util.Date;
import java.util.Locale;

/** App settings and the reply log, kept in SharedPreferences. */
public class Store {

    public static final String PKG_VIBER = "com.viber.voip";
    public static final String PKG_MESSENGER = "com.facebook.orca";
    public static final String PKG_MESSENGER_LITE = "com.facebook.mlite";

    public static final String DEFAULT_MODEL = "google/gemini-2.5-flash";

    public static final String DEFAULT_PROMPT =
            "သင်က \"GG Game Shop\" ရဲ့ အရောင်းဝန်ထမ်းပါ။ မြန်မာလို ယဉ်ယဉ်ကျေးကျေး၊ တိုတိုရှင်းရှင်း ဖြေပါ။\n\n"
            + "ရောင်းတာ: Mobile Legends Diamonds, PUBG UC top-up\n\n"
            + "ဈေးနှုန်း:\n"
            + "- ML 86 Diamonds = ____ ကျပ်\n"
            + "- ML 172 Diamonds = ____ ကျပ်\n"
            + "- PUBG 60 UC = ____ ကျပ်\n"
            + "- PUBG 325 UC = ____ ကျပ်\n\n"
            + "ငွေလွှဲ: KBZPay ____ (နာမည် ____)\n\n"
            + "Order ယူပုံ: Game ID (ML ဆို Server ID ပါ) နဲ့ ဘယ်ပမာဏလဲ မေးပါ။ "
            + "ငွေလွှဲပြီး Screenshot ပို့ခိုင်းပါ။ Screenshot ပို့ပြီလို့ ပြောရင် \"စစ်ပြီး ခဏနေ ဖြည့်ပေးပါမယ်\" လို့ ပြောပါ။\n\n"
            + "စည်းကမ်း:\n"
            + "- ဈေးနှုန်းစာရင်းမှာ မပါတာကို ကိုယ့်ဘာသာ မခန့်မှန်းနဲ့။ မသိရင် \"Admin က ခဏနေ ပြန်ဖြေပေးပါမယ်\" လို့ ပြောပါ။\n"
            + "- သူငယ်ချင်း/မိသားစု စကားလို ဆိုင်နဲ့ လုံးဝမဆိုင်တဲ့ စာဆိုရင် SKIP ဆိုတဲ့ စာလုံးတစ်လုံးတည်းပဲ ပြန်ပါ။";

    private static final int MAX_LOG_LINES = 60;

    private final SharedPreferences p;

    public Store(Context c) {
        p = c.getSharedPreferences("agent", Context.MODE_PRIVATE);
    }

    public SharedPreferences prefs() {
        return p;
    }

    public boolean enabled() {
        return p.getBoolean("enabled", false);
    }

    public String apiKey() {
        return p.getString("api_key", "").trim();
    }

    public String model() {
        String m = p.getString("model", DEFAULT_MODEL).trim();
        return m.isEmpty() ? DEFAULT_MODEL : m;
    }

    public String prompt() {
        String s = p.getString("prompt", DEFAULT_PROMPT);
        return s.trim().isEmpty() ? DEFAULT_PROMPT : s;
    }

    public boolean appEnabled(String pkg) {
        if (PKG_VIBER.equals(pkg)) return p.getBoolean("app_viber", true);
        if (PKG_MESSENGER.equals(pkg)) return p.getBoolean("app_messenger", true);
        if (PKG_MESSENGER_LITE.equals(pkg)) return p.getBoolean("app_messenger_lite", true);
        return false;
    }

    public boolean ignoreGroups() {
        return p.getBoolean("ignore_groups", true);
    }

    public int delaySec() {
        return Math.max(3, p.getInt("delay", 10));
    }

    public String keywords() {
        return p.getString("keywords", "");
    }

    public String skipNames() {
        return p.getString("skip_names", "");
    }

    /** True when no keywords are set, or the text contains one of them. */
    public boolean matchesKeyword(String text) {
        String lower = text.toLowerCase(Locale.ROOT);
        boolean any = false;
        for (String k : keywords().split("[,၊\\n]")) {
            String kw = k.trim().toLowerCase(Locale.ROOT);
            if (kw.isEmpty()) continue;
            any = true;
            if (lower.contains(kw)) return true;
        }
        return !any;
    }

    /** True when the sender's name matches one of the names the agent must never answer. */
    public boolean isSkipped(String sender) {
        String s = sender.trim().toLowerCase(Locale.ROOT);
        for (String n : skipNames().split("[,၊\\n]")) {
            String name = n.trim().toLowerCase(Locale.ROOT);
            if (!name.isEmpty() && s.contains(name)) return true;
        }
        return false;
    }

    public static synchronized void log(Context c, String line) {
        SharedPreferences sp = c.getSharedPreferences("agent", Context.MODE_PRIVATE);
        String time = new SimpleDateFormat("MM-dd HH:mm", Locale.US).format(new Date());
        String old = sp.getString("log", "");
        String[] lines = old.isEmpty() ? new String[0] : old.split("\n");
        StringBuilder b = new StringBuilder();
        b.append(time).append("  ").append(line.replace('\n', ' '));
        for (int i = 0; i < lines.length && i < MAX_LOG_LINES - 1; i++) {
            b.append('\n').append(lines[i]);
        }
        sp.edit().putString("log", b.toString()).apply();
    }

    public static String readLog(Context c) {
        return c.getSharedPreferences("agent", Context.MODE_PRIVATE).getString("log", "");
    }

    public static void clearLog(Context c) {
        c.getSharedPreferences("agent", Context.MODE_PRIVATE).edit().remove("log").apply();
    }
}
